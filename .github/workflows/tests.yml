name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      # Compiles the translations, which are not committed, type-checks and
      # builds the app.
      - name: Build
        run: npm run build

      # Tests tagged [BUG-n] describe known bugs and fail until those are
      # fixed, so they run in the next step, which may fail.
      - name: Test
        run: npm run test:coverage -- --testNamePattern '^(?!.*\[BUG-)'

      - name: Known bugs
        continue-on-error: true
        run: npm test -- --testNamePattern '\[BUG-'
